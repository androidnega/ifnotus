# IFNOTUS PHASE 38D — SFTP only (no interactive shell).
# Do not add a second Subsystem sftp line (duplicate fails sshd -t).
Match Group ifnotus-sftp,!ifnotus-ssh
    PasswordAuthentication yes
    PubkeyAuthentication yes
    AuthorizedKeysFile /etc/ssh/ifnotus_authorized_keys/%u
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitRootLogin no
    AllowAgentForwarding no
    ForceCommand internal-sftp -d /public
    ChrootDirectory %h
