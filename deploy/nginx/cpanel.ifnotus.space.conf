# IFNOTUS legacy staff control-panel hostname redirect.
# 301 Permanent Redirect to canonical fpanel.ifnotus.space.

server {
    listen 80;
    listen [::]:80;
    server_name cpanel.ifnotus.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://fpanel.ifnotus.space$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cpanel.ifnotus.space;
    ssl_certificate /etc/letsencrypt/live/cpanel.ifnotus.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpanel.ifnotus.space/privkey.pem;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://fpanel.ifnotus.space$request_uri; }
}
