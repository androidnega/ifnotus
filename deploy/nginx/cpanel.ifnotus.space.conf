# IFNOTUS staff control-panel hostname.
# Serves the same SPA as ifnotus.space. Hostname is not authorization.

server {
    listen 80;
    listen [::]:80;
    server_name cpanel.ifnotus.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cpanel.ifnotus.space;
    ssl_certificate /etc/letsencrypt/live/cpanel.ifnotus.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpanel.ifnotus.space/privkey.pem;
    root /var/www/ifnotus;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin_1 {
        return 302 https://cpanel.ifnotus.space/login$is_args$args;
    }
    location = /admin_1/ {
        return 302 https://cpanel.ifnotus.space/login$is_args$args;
    }
    location = /staff-login {
        return 302 https://cpanel.ifnotus.space/login$is_args$args;
    }
    location = /staff-login/ {
        return 302 https://cpanel.ifnotus.space/login$is_args$args;
    }
    location = /staff/login {
        return 302 https://cpanel.ifnotus.space/login$is_args$args;
    }
    location = /staff/login/ {
        return 302 https://cpanel.ifnotus.space/login$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
