# Default catch-all server block for unmapped HTTP and HTTPS hostnames.
# Prevents unmatched requests from falling through to any customer virtual host.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow Let's Encrypt HTTP-01 challenges on unmapped hosts if needed
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }

    location / {
        return 421;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Nginx 1.19.4+ (Ubuntu 1.24.0) rejects TLS handshake immediately for unmapped SNI hosts
    # Prevents certificate mismatch warnings or leaking another tenant's vhost/certificate.
    ssl_reject_handshake on;
}
