# Bootstrap vhost for Let's Encrypt (HTTP only). Replace with
# cpanel.ifnotus.space.conf after the certificate exists.
# Serves the same SPA as ifnotus.space. Hostname is not authorization.

server {
    listen 80;
    listen [::]:80;
    server_name cpanel.ifnotus.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    root /var/www/ifnotus;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
