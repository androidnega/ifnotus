# Include from the ifnotus.space server{} only AFTER
# https://cpanel.ifnotus.space has a valid certificate.
# Promoted staff entry is cpanel.ifnotus.space; these paths stay as compatibility.

location = /admin_1 {
    return 302 https://cpanel.ifnotus.space/login$is_args$args;
}
location = /admin_1/ {
    return 302 https://cpanel.ifnotus.space/login$is_args$args;
}
location = /staff-login {
    return 302 https://cpanel.ifnotus.space/login$is_args$args;
}
location = /staff-login/ {
    return 302 https://cpanel.ifnotus.space/login$is_args$args;
}
location = /staff/login {
    return 302 https://cpanel.ifnotus.space/login$is_args$args;
}
location = /staff/login/ {
    return 302 https://cpanel.ifnotus.space/login$is_args$args;
}
